
<table class="schedule">
  <thead>
    <tr>
      <th>Time</th>
      <th>Session</th>
      <th>Details</th>
    </tr>
  </thead>

  <tbody>
    {{ range . }}
      <tr>
        <td>{{ .time }}</td>
        <td>{{ .session }}</td>
        
        <td>
          {{ if .speakerName }}
            <a href="{{ .speakerHref | relURL }}" class="speaker-link">
              {{ .speakerName }}
            </a>
            ·
          {{ end }}
          {{ .details }}
</td>

      </tr>
    {{ end }}
  </tbody>
</table>
