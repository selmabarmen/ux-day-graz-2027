
<table class="schedule">
  <thead>
    <tr>
      <th>Time</th>
      <th>Session</th>
      <th>Details</th>
    </tr>
  </thead>

  <tbody>
    {{ range . }}
      <tr>
        <td>{{ .time }}</td>
        <td>{{ .title }}</td>
        <td>{{ .details }}</td>
      </tr>
    {{ end }}
  </tbody>
</table>
